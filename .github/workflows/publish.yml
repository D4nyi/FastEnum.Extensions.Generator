# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish

permissions:
  contents: write
  pull-requests: write

on: [workflow_dispatch]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          dotnet-quality: ga

      - name: Tests
        uses: D4nyi/DotNet-Actions/runTests@fix-errors
        with:
          build_configuration: Release

  read-tags:
    name: Get Tags
    runs-on: ubuntu-latest
    needs: [tests, analyze]
    outputs:
      tags: ${{ steps.read-tags.outputs.tags }}
    steps:
      - name: Read Tags
        id: read-tags
        uses: D4nyi/DotNet-Actions/readTags@fix-errors
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  read-versions:
    name: Read Version
    runs-on: ubuntu-latest
    needs: [tests, analyze]
    outputs:
      versions: ${{ steps.read-versions.outputs.versions }}
    steps:
      - name: Read Versions
        id: read-versions
        uses: D4nyi/DotNet-Actions/readProjectVersions@fix-errors

  publish:
    name: Publish
    needs: [read-tags, read-versions]
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Read Versions
        uses: D4nyi/DotNet-Actions/publish@fix-errors
        with:
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ needs.read-tags.outputs.tags }}
          versions: ${{ needs.read-versions.outputs.versions }}
